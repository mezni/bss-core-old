[project]
name = "bss-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "sqlalchemy>=2.1.8",
    "starlette>=1.10.0",
    "uvloop>=0.23.0",
]

[project.scripts]
bss-core = "bss_core:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
